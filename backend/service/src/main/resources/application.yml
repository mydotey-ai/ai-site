spring:
  application:
    name: ai-site-api

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/ai_site?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

# 存储配置
storage:
  type: local
  local:
    base-path: ./uploads
    url-prefix: /uploads

# 上传配置
upload:
  image:
    max-size: 5242880
    allowed-types: image/jpeg,image/png,image/gif,image/webp
  video:
    max-size: 104857600
    allowed-types: video/mp4,video/webm
  audio:
    max-size: 20971520
    allowed-types: audio/mpeg,audio/wav,audio/mp3

# 图片处理配置
image:
  thumbnail:
    enabled: true
    width: 300
  compress:
    enabled: true
    quality: 0.8
  watermark:
    enabled: false
    text: ""
    position: bottom-right
    opacity: 0.5

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.mydotey.ai.site: DEBUG
    org.springframework.web: INFO